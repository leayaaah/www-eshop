<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title th:text="${pageTitle} ?: 'eShop'">
   eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:fragment="tracking">
    <script th:inline="javascript">window.eshopTrackingEnabled = /*[[${clientTrackingEnabled}]]*/ true;</script>
    <script th:src="@{/js/consent.js}" defer></script>
    <script>
      try {
        var consent = JSON.parse(localStorage.getItem('eshop_consent') || 'null');
        if (consent && consent.analytics === true && consent.policyVersion === '2026-11-01') {
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src =
              "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "MA_DU_AN_CLARITY");
        }
      } catch (_) {}
    </script>
    <script th:src="@{/js/tracker.js}" defer></script>
  </th:block>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <a sec:authorize="hasAuthority('ROLE_SELLER')" th:href="@{/admin/products}">
     Quản trị
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <section th:replace="${content}">
   </section>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
