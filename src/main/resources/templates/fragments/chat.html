<section class="chat-widget" th:fragment="chat">
  <button type="button" class="chat-toggle" aria-controls="chat-panel" aria-expanded="false">
    <span class="chat-toggle-icon" aria-hidden="true">✦</span>
    <span>Trợ lý AI</span>
  </button>
  <div id="chat-panel" class="chat-panel" hidden>
    <div class="chat-header">
      <div class="chat-agent">
        <div class="chat-agent-avatar" aria-hidden="true">✦</div>
        <div>
          <div class="chat-agent-name">IUH Tech Advisor <span class="chat-online">Trực tuyến</span></div>
          <div class="chat-agent-subtitle">Tư vấn thiết bị học tập và công nghệ</div>
        </div>
      </div>
      <button type="button" class="chat-close" aria-label="Đóng cửa sổ chat" title="Đóng cửa sổ chat">×</button>
    </div>
    <div class="chat-messages" aria-live="polite">
      <div class="chat-message chat-message-bot">
        <div class="chat-avatar" aria-hidden="true">✦</div>
        <div class="chat-bubble">
          <strong>Chào bạn! Mình là trợ lý AI IUH eShop.</strong>
          <span>Bạn cần tìm laptop, máy in hay phụ kiện cho ngành học nào?</span>
        </div>
      </div>
    </div>
    <form class="chat-form">
      <input maxlength="500" name="message" placeholder="Hỏi về sản phẩm hoặc cấu hình..." autocomplete="off" required>
      <button aria-label="Gửi tin nhắn">Gửi</button>
    </form>
    <div class="chat-note">IUH Tech Advisor · Enter để gửi</div>
  </div>
  <script th:src="@{/js/chat.js(v='fd8f3b5')}" defer></script>
</section>
