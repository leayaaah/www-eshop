<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Chi tiết đơn hàng - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <h1>
    Đơn hàng #
    <span th:text="${order.id}">
    </span>
   </h1>
   <p>
    Trạng thái:
    <b th:text="${order.status}">
    </b>
   </p>
   <p>
    Người nhận:
    <span th:text="${order.customerName}">
    </span>
   </p>
   <p>
    Điện thoại:
    <span th:text="${order.phone}">
    </span>
   </p>
   <p>
    Địa chỉ:
    <span th:text="${order.address}">
    </span>
   </p>
   <p>
    Thanh toán:
    <span th:text="${order.paymentMethod}">
    </span>
   </p>
   <table>
    <tr>
     <th>
      Sản phẩm
     </th>
     <th>
      SL
     </th>
     <th>
      Đơn giá
     </th>
    </tr>
    <tr th:each="d:${order.details}">
     <td th:text="${d.product.name}">
     </td>
     <td th:text="${d.quantity}">
     </td>
     <td th:text="${d.unitPrice}">
     </td>
    </tr>
   </table>
   <h2>
    Tổng:
    <span th:text="${order.totalAmount}">
    </span>
    ₫
   </h2>
   <a th:href="@{/orders}">
    Đơn hàng của tôi
   </a>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
