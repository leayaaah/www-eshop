<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Chi tiết đơn hàng - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <div class="page-heading">
    <div>
     <p class="eyebrow">CHI TIẾT ĐƠN HÀNG</p>
     <h1>Đơn hàng #<span th:text="${order.id}"></span></h1>
     <p class="page-subtitle" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></p>
    </div>
    <span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status}"></span>
   </div>
   <div class="order-detail-layout">
    <section class="info-card">
     <h2>Thông tin nhận hàng</h2>
     <dl class="order-info">
      <div><dt>Người nhận</dt><dd th:text="${order.customerName}"></dd></div>
      <div><dt>Điện thoại</dt><dd th:text="${order.phone}"></dd></div>
      <div><dt>Địa chỉ</dt><dd th:text="${order.address}"></dd></div>
      <div><dt>Thanh toán</dt><dd th:text="${order.paymentMethod}"></dd></div>
     </dl>
    </section>
    <section class="info-card">
     <h2>Sản phẩm</h2>
     <table class="order-detail-table">
      <thead>
       <tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th></tr>
      </thead>
      <tbody>
       <tr th:each="d:${order.details}">
        <td class="product-cell" th:text="${d.product.name}"></td>
        <td th:text="${d.quantity}"></td>
        <td class="money" th:text="${#numbers.formatDecimal(d.unitPrice,0,'COMMA',0,'POINT')} + ' ₫'"></td>
       </tr>
      </tbody>
     </table>
     <div class="order-total">
      <span>Tổng thanh toán</span>
      <strong th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'"></strong>
     </div>
    </section>
   </div>
   <a class="button secondary" th:href="@{/orders}">← Đơn hàng của tôi</a>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
