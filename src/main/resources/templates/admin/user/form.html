<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Tạo tài khoản - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <h1>
    Tạo tài khoản
   </h1>
   <form class="form" method="post" th:action="@{/admin/users}" th:object="${form}">
    <label>
     Tên đăng nhập
     <input required="" th:field="*{username}"/>
    </label>
    <label>
     Mật khẩu
     <input minlength="6" required="" th:field="*{password}" type="password"/>
    </label>
    <label>
     Họ tên
     <input required="" th:field="*{fullName}"/>
    </label>
    <label>
     Email
     <input required="" th:field="*{email}" type="email"/>
    </label>
    <label>
     Điện thoại
     <input th:field="*{phone}"/>
    </label>
    <label>
     Địa chỉ
     <input th:field="*{address}"/>
    </label>
    <label>
     Vai trò
     <select th:field="*{role}">
      <option value="ROLE_CUSTOMER">
       ROLE_CUSTOMER
      </option>
      <option value="ROLE_SELLER">
       ROLE_SELLER
      </option>
     </select>
    </label>
    <label>
     <input th:field="*{enabled}" type="checkbox"/>
     Được phép đăng nhập
    </label>
    <button>
     Lưu
    </button>
   </form>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
