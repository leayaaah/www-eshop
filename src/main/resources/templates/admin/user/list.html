<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Quản lý tài khoản - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <h1>
    Quản lý tài khoản
   </h1>
   <a class="button" th:href="@{/admin/users/new}">
    Thêm tài khoản
   </a>
   <table>
    <tr>
     <th>
      ID
     </th>
     <th>
      Tên đăng nhập
     </th>
     <th>
      Họ tên
     </th>
     <th>
      Email
     </th>
     <th>
      Vai trò
     </th>
     <th>
      Kích hoạt
     </th>
     <th>
     </th>
    </tr>
    <tr th:each="u:${users}">
     <td th:text="${u.id}">
     </td>
     <td th:text="${u.username}">
     </td>
     <td th:text="${u.fullName}">
     </td>
     <td th:text="${u.email}">
     </td>
     <td th:text="${u.role}">
     </td>
     <td th:text="${u.enabled}">
     </td>
     <td>
      <form method="post" th:action="@{/admin/users/{id}/delete(id=${u.id})}">
       <button class="danger">
        Xoá
       </button>
      </form>
     </td>
    </tr>
   </table>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
