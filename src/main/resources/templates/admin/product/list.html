<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Quản lý sản phẩm - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <h1>
    Quản lý sản phẩm
   </h1>
   <a class="button" th:href="@{/admin/products/new}">
    Thêm sản phẩm
   </a>
   <a class="button secondary" th:href="@{/admin/products/map}">
    Bản đồ 2D
   </a>
   <form>
    <input name="keyword" placeholder="Tìm sản phẩm" th:value="${keyword}"/>
    <button>
     Tìm
    </button>
   </form>
   <table>
    <tr>
     <th>
      ID
     </th>
     <th>
      Tên
     </th>
     <th>
      Giá
     </th>
     <th>
      Tồn kho
     </th>
     <th>
      Danh mục
     </th>
     <th>
     </th>
    </tr>
    <tr th:each="p:${products.content}">
     <td th:text="${p.id}">
     </td>
     <td th:text="${p.name}">
     </td>
     <td th:text="${p.price}">
     </td>
     <td th:text="${p.quantity}">
     </td>
     <td th:text="${p.category.name}">
     </td>
     <td>
      <a th:href="@{/admin/products/{id}/edit(id=${p.id})}">
       Sửa
      </a>
      <form class="inline" method="post" th:action="@{/admin/products/{id}/delete(id=${p.id})}">
       <button class="danger">
        Xoá
       </button>
      </form>
     </td>
    </tr>
   </table>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
