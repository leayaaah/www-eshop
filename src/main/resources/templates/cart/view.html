<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Giỏ hàng - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:replace="~{fragments/layout :: tracking}"></th:block>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <h1>
    Giỏ hàng
   </h1>
   <p th:if="${cart.isEmpty()}">
    Giỏ hàng đang trống.
   </p>
   <table th:if="${!cart.isEmpty()}">
    <thead>
     <tr>
      <th>
       Sản phẩm
      </th>
      <th>
       Đơn giá
      </th>
      <th>
       Số lượng
      </th>
      <th>
       Tạm tính
      </th>
      <th>
      </th>
     </tr>
    </thead>
    <tbody>
     <tr th:each="entry:${cart.items}">
      <td th:text="${entry.value.product.name}">
      </td>
      <td th:text="${entry.value.product.price}">
      </td>
      <td>
       <form class="inline" method="post" th:action="@{/cart/update/{id}(id=${entry.key})}">
        <input min="0" name="quantity" th:value="${entry.value.quantity}" type="number"/>
        <button>
         Cập nhật
        </button>
       </form>
      </td>
      <td th:text="${entry.value.product.price * entry.value.quantity}">
      </td>
      <td>
       <form method="post" th:action="@{/cart/remove/{id}(id=${entry.key})}">
        <button class="danger">
         Xoá
        </button>
       </form>
      </td>
     </tr>
    </tbody>
   </table>
   <h2 th:if="${!cart.isEmpty()}">
    Tổng:
    <span th:text="${cart.total}">
    </span>
    ₫
   </h2>
   <a class="button" th:href="@{/checkout}" th:if="${!cart.isEmpty()}">
    Thanh toán
   </a>
   <a th:href="@{/}">
    Tiếp tục mua hàng
   </a>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
  <div th:replace="~{fragments/chat :: chat}"></div>
 </body>
</html>
