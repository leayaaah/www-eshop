<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Thanh toán - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:replace="~{fragments/layout :: tracking}"></th:block>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a th:href="@{/settings}">Quyền riêng tư</a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <h1>
    Thanh toán
   </h1>
   <form class="form" method="post" th:action="@{/checkout}" th:object="${form}">
    <label>
     Họ tên
     <input th:field="*{customerName}"/>
    </label>
    <small th:errors="*{customerName}">
    </small>
    <label>
     Số điện thoại
     <input th:field="*{phone}"/>
    </label>
    <small th:errors="*{phone}">
    </small>
    <label>
     Địa chỉ
     <input th:field="*{address}"/>
    </label>
    <small th:errors="*{address}">
    </small>
    <label>
     Ghi chú
     <textarea th:field="*{note}"></textarea>
    </label>
    <label>
     Phương thức thanh toán
     <select th:field="*{paymentMethod}">
      <option th:each="p:${paymentMethods}" th:text="${p == T(iuh.fit.eshop.entity.PaymentMethod).COD ? 'Thanh toán khi nhận hàng' : 'Chuyển khoản giả lập'}" th:value="${p}">
      </option>
     </select>
    </label>
    <p>
     Tổng thanh toán:
     <b th:text="${cart.total}">
     </b>
     ₫
    </p>
    <button>
     Đặt hàng
    </button>
   </form>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
