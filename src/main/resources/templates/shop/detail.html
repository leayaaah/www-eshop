<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Chi tiết sản phẩm - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:replace="~{fragments/layout :: tracking}"></th:block>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <div th:replace="~{fragments/recommend :: products('Sản phẩm tương tự', ${similar})}"></div>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <a th:href="@{/}">
    ← Cửa hàng
   </a>
   <div class="detail">
    <img alt="product" th:src="${product.imageUrl} ?: 'https://placehold.co/500x400?text=eShop'"/>
    <div>
     <h1 th:text="${product.name}">
     </h1>
     <p th:text="${product.description}">
     </p>
     <p class="price" th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')} + ' ₫'">
     </p>
     <p>
      Danh mục:
      <span th:text="${product.category.name}">
      </span>
     </p>
     <p>
      Tồn kho:
      <span th:text="${product.quantity}">
      </span>
     </p>
     <form method="post" sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:action="@{/cart/add/{id}(id=${product.id})}">
      <input min="1" name="quantity" th:max="${product.quantity}" type="number" value="1"/>
      <button>
       Thêm vào giỏ
      </button>
     </form>
     <a sec:authorize="isAnonymous()" th:href="@{/login}">
      Đăng nhập để mua hàng
     </a>
    </div>
   </div>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
  <div th:replace="~{fragments/chat :: chat}"></div>
 </body>
</html>
