<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Cửa hàng - eShop
  </title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <th:block th:replace="~{fragments/layout :: tracking}"></th:block>
 </head>
 <body>
  <header>
   <a class="brand" th:href="@{/}">
    IUH eShop
   </a>
   <nav>
    <a th:href="@{/}">
     Cửa hàng
    </a>
    <a th:href="@{/cart}">
     Giỏ hàng (
     <span th:text="${cartCount} ?: 0">
      0
     </span>
     )
    </a>
    <a sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:href="@{/orders}">
     Đơn hàng của tôi
    </a>
    <span sec:authorize="hasAuthority('ROLE_SELLER')">
     <a th:href="@{/admin/categories}">
      Danh mục
     </a>
     <a th:href="@{/admin/products}">
      Sản phẩm
     </a>
     <a th:href="@{/admin/orders}">
      Đơn hàng
     </a>
     <a th:href="@{/admin/users}">
      Tài khoản
     </a>
    </span>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
     Đăng nhập
    </a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">
     Đăng ký
    </a>
    <form class="inline" method="post" sec:authorize="isAuthenticated()" th:action="@{/logout}">
     <button>
      Đăng xuất
     </button>
    </form>
   </nav>
  </header>
  <main>
   <div class="alert" th:if="${error}" th:text="${error}">
   </div>
   <h1>
    Cửa hàng
   </h1>
   <form class="filters" method="get" th:action="@{/}">
    <input name="keyword" placeholder="Tìm tên sản phẩm" th:value="${keyword}"/>
    <select name="categoryId">
     <option value="">
      Tất cả danh mục
     </option>
     <option th:each="c:${categories}" th:selected="${categoryId == c.id}" th:text="${c.name}" th:value="${c.id}">
     </option>
    </select>
    <button>
     Tìm kiếm
    </button>
   </form>
   <div class="grid">
    <article class="card" th:each="p:${products.content}">
     <a th:href="@{/products/{id}(id=${p.id})}">
      <img alt="product" th:src="${p.imageUrl} ?: 'https://placehold.co/400x300?text=eShop'"/>
      <h3 th:text="${p.name}">
      </h3>
     </a>
     <p class="price" th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' ₫'">
     </p>
     <p>
      Tồn kho:
      <span th:text="${p.quantity}">
      </span>
     </p>
     <form method="post" sec:authorize="hasAuthority('ROLE_CUSTOMER')" th:action="@{/cart/add/{id}(id=${p.id})}">
      <input min="1" name="quantity" th:max="${p.quantity}" type="number" value="1"/>
      <button th:disabled="${p.quantity == 0}">
       Thêm vào giỏ
      </button>
     </form>
    </article>
   </div>
   <div class="pagination">
    <a th:href="@{/(keyword=${keyword},categoryId=${categoryId},page=${products.number-1})}" th:if="${products.hasPrevious()}">
     Trước
    </a>
    <span th:text="${products.number + 1 + ' / ' + products.totalPages}">
    </span>
    <a th:href="@{/(keyword=${keyword},categoryId=${categoryId},page=${products.number+1})}" th:if="${products.hasNext()}">
     Sau
    </a>
   </div>
  </main>
  <footer>
   IUH eShop · Spring Boot · MariaDB
  </footer>
 </body>
</html>
