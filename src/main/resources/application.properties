spring.application.name=eshop
server.port=8080
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
app.jwt.secret=${JWT_SECRET:change-me-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring AI - Gemini qua Google AI Studio
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# VectorStore MariaDB
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=3072

# B?t/t?t AI, n?p d? li?u l�c kh?i ??ng
app.ai.enabled=${AI_ENABLED:false}
app.ai.ingest-on-startup=${AI_INGEST_ON_STARTUP:false}
app.reco.half-life-days=14
app.reco.top-n=8
app.chat.max-message-length=500
app.chat.rate-limit-per-10min=20