spring.application.name=eshop
server.port=8080
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=root
spring.datasource.password=1234231
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring AI - Gemini qua Google AI Studio
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT:disabled}
spring.ai.google.genai.embedding.location=${GOOGLE_CLOUD_LOCATION:us-central1}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.model.chat=${AI_MODEL:none}
spring.ai.model.embedding=${AI_EMBEDDING_MODEL:none}
spring.ai.model.embedding.text=${AI_EMBEDDING_MODEL:none}
spring.ai.vectorstore.type=${AI_VECTORSTORE_TYPE:none}

# VectorStore MariaDB
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=3072

# B?t/t?t AI, n?p d? li?u l�c kh?i ??ng
app.ai.enabled=${AI_ENABLED:false}
app.ai.ingest-on-startup=${AI_INGEST_ON_STARTUP:false}
app.reco.half-life-days=14
app.reco.top-n=8
app.chat.max-message-length=500
app.chat.rate-limit-per-10min=20
app.ai.chat-timeout-ms=${AI_CHAT_TIMEOUT_MS:25000}
app.ai.vector-search-timeout-ms=${AI_VECTOR_SEARCH_TIMEOUT_MS:8000}
