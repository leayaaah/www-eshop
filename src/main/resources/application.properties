spring.application.name=eshop
server.port=8080
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=root
spring.datasource.password=1234231
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Local chatbot mode: SQL product lookup only; Gemini and VectorStore are disabled.
app.ai.enabled=false
app.ai.ingest-on-startup=false
app.reco.half-life-days=14
app.reco.top-n=8
app.chat.max-message-length=500
app.chat.rate-limit-per-10min=20
app.ai.chat-timeout-ms=${AI_CHAT_TIMEOUT_MS:10000}
app.ai.vector-search-timeout-ms=${AI_VECTOR_SEARCH_TIMEOUT_MS:8000}
