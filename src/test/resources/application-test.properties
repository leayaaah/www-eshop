spring.application.name=eshop
server.port=8080
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MariaDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
app.jwt.secret=N45bb7tsq8gOEJgSwlOh2QJ88qa66XO66l2+9pGjnM/YI0zwef4ob8hrFuifheOM
app.jwt.expiration-ms=86400000

# Spring AI - disabled for tests (no API key needed)
app.ai.enabled=false
app.ai.ingest-on-startup=false
app.tracking.client-enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,org.springframework.ai.vectorstore.mariadb.autoconfigure.MariaDbStoreAutoConfiguration